upgrade-branch.swirdy-tier-1.desc = Sát thương tầm xa: 54 -> 82,5 (trước hệ số đạn).
upgrade-branch.swirdy-tier-2.name = Sát thương III
upgrade-branch.swirdy-tier-2.desc = Đã đạt sát thương tầm xa tối đa (82,5 trước hệ số đạn).
