block.nevix-emperical.name = Emperical
block.nevix-emperical.description = Một khẩu tháp rèn kiếm khổng lồ. Phóng những thanh kiếm phép xuyên thấu kẻ địch, và có thể tung ra Đại kiếm vỡ thành những mảnh làm chậm. Mỗi mạng hạ gục có thể trói buộc Kiếm linh về bên mình.
bar.emperical-intrinsic = Nội tại
bar.emperical-spirit = Kiếm linh
status.emperical-sword-slow.name = Làm chậm (Kiếm)
status.emperical-sword-slow.description = Bị làm chậm bởi những mảnh kiếm nặng.
upgrade-branch.emperical-reload-0.name = Nạp đạn I
upgrade-branch.emperical-reload-0.desc = Nạp đạn: 1,17 giây -> 1,08 giây.
upgrade-branch.emperical-reload-1.name = Nạp đạn II
upgrade-branch.emperical-reload-1.desc = Nạp đạn: 1,08 giây -> 1,00 giây.
upgrade-branch.emperical-reload-2.name = Nạp đạn III
upgrade-branch.emperical-reload-2.desc = Nạp đạn: 1,00 giây -> 0,83 giây.
upgrade-branch.emperical-range.name = Tầm bắn
upgrade-branch.emperical-range.desc = Tầm bắn: 45 -> 55 ô.
upgrade-branch.emperical-damage-1.name = Sát thương I
upgrade-branch.emperical-damage-1.desc = Sát thương: 510 -> 637,5.
upgrade-branch.emperical-damage-2.name = Sát thương II
upgrade-branch.emperical-damage-2.desc = Sát thương: 637,5 -> 765.
upgrade-branch.emperical-intrinsic.name = Kiếm nội tại
upgrade-branch.emperical-intrinsic.desc = Mỗi phát bắn tặng +10% tốc độ tấn công, cộng dồn tối đa +400%. Đặt lại sau 5 giây không bắn. Khi vượt 100%, mỗi chu kỳ phóng 5 thanh kiếm theo hướng ngẫu nhiên thay vì 1.
upgrade-branch.emperical-charge-shoot-0.name = Phát tích lực I
upgrade-branch.emperical-charge-shoot-0.desc = 2% cơ hội mỗi chu kỳ phóng một Đại kiếm gây 5x sát thương, tạo ra 3-10 mảnh kiếm gây 1,5x sát thương và áp dụng Làm chậm (70% trong 2 giây). Sau đó các mảnh kiếm hợp nhất và chém ngược về phía Emperical.
upgrade-branch.emperical-charge-shoot-1.name = Phát tích lực II
upgrade-branch.emperical-charge-shoot-1.desc = 5% cơ hội mỗi chu kỳ. Hệ số Đại kiếm tăng từ 5x lên 9x.
upgrade-branch.emperical-sword-spirit-0.name = Kiếm linh I
upgrade-branch.emperical-sword-spirit-0.desc = Mỗi mạng hạ gục có 1% cơ hội nhận một điểm Kiếm linh. Tối đa 1 Kiếm linh chiến đấu cùng bạn, có 50% máu và sát thương của Emperical.
upgrade-branch.emperical-sword-spirit-1.name = Kiếm linh II
upgrade-branch.emperical-sword-spirit-1.desc = Tối đa 3 Kiếm linh hoạt động cùng lúc.
upgrade-branch.emperical-sword-spirit-2.name = Kiếm linh III
upgrade-branch.emperical-sword-spirit-2.desc = Tối đa 5 Kiếm linh hoạt động cùng lúc. Mỗi điểm Kiếm linh vượt quá 5 tặng +2,5% máu và sát thương Kiếm linh.
block.nevix-emperical.custom-stat.none.empericalGreatBlade = Đại kiếm phát nổ khi va chạm, gây 5x (hoặc 9x) sát thương trong một vùng. Sau đó vỡ thành 3-10 mảnh kiếm mưa xuống quanh điểm va chạm, mỗi mảnh gây 1,5x sát thương và áp dụng Làm chậm (giảm 70% tốc độ trong 2 giây). Ngay sau khi chém, các mảnh kiếm bay vượt qua điểm va chạm theo chiều bay của Đại kiếm và hợp nhất tại đó, rồi thanh kiếm hợp nhất chém ngược về phía Emperical, gây sát thương cho mọi kẻ địch trên đường đi.
block.nevix-emperical.custom-stat.none.empericalIntrinsic = Mỗi phát bắn tặng +10% tốc độ tấn công. Cộng dồn tối đa +400%, đặt lại sau 5 giây không bắn. Khi vượt 100%, mỗi chu kỳ phóng 5 thanh kiếm theo hướng ngẫu nhiên thay vì 1.
block.nevix-emperical.custom-stat.none.empericalSwordSpirit = Kiếm linh bay quanh tháp và tự tấn công kẻ địch gần đó. Mỗi mạng hạ gục có 1% cơ hội nhận một điểm Kiếm linh. Kiếm linh hồi máu từ sát thương gây ra, có thể chém liên hoàn, lướt và phóng kiếm kỹ năng. Máu và sát thương cơ bản bằng 50% của Emperical; điểm vượt quá giới hạn triệu hồi tặng +2,5% máu và sát thương mỗi điểm. Nếu Emperical hết đạn hoặc hiệu suất gần như bằng 0, toàn bộ Kiếm linh mờ dần rồi biến mất và không thể triệu hồi lại cho đến khi tháp hoạt động trở lại. Thời gian hồi sinh vẫn được tính trong lúc đó.