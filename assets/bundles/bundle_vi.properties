upgrade-branch.swirdy-melee-passive-skill.desc = Khi đủ 100 điểm kỹ năng, tung ra chuỗi chém liên hoàn kết thúc bằng đòn xung kích 3 đường.
upgrade-branch.swirdy-passive-skill.name = Kỹ năng tầm xa
upgrade-branch.swirdy-passive-skill.desc = Khi đủ 100 điểm kỹ năng, bắn 5 đợt sóng liên tiếp, sau đó tích lực phát sóng cuối.
block.nevix-swirdy.custom-stat.none.swirdyMelee = Chế độ cận chiến: chém liên hoàn theo cung vào kẻ địch gần. Mỗi đòn hồi 2% sát thương gây ra thành máu.
block.nevix-swirdy.custom-stat.none.swirdyFinalWave = Mỗi phát bắn tầm xa có tỉ lệ bắn kèm đòn cuối của kỹ năng, gây 3000% sát thương sóng.
