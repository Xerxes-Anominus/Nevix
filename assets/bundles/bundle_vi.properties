upgrade-branch.berserker-blood-shield.name = Khiên máu
upgrade-branch.berserker-blood-shield.desc = Hút máu 50% sát thương gây ra. Phần hồi máu vượt mức trở thành Khiên máu không giới hạn; khiên hấp thụ mọi sát thương và chặn đạn của kẻ địch gần đó.
upgrade-branch.berserker-enrage-0.name = Cuồng nộ I
upgrade-branch.berserker-enrage-0.desc = Sau 50 phát bắn, Cuồng nộ trong 1 giây. Đạn không giới hạn, hồi 0,5% máu tối đa mỗi đòn, +50% sát thương. Phát tích lực cuối gây 3000%.
upgrade-branch.berserker-enrage-1.name = Cuồng nộ II
upgrade-branch.berserker-enrage-1.desc = Sau 40 phát bắn, Cuồng nộ trong 2 giây. Đạn không giới hạn, hồi 0,75% máu tối đa mỗi đòn, +100% sát thương. Phát tích lực cuối gây 5000%.
upgrade-branch.berserker-enrage-2.name = Cuồng nộ III
upgrade-branch.berserker-enrage-2.desc = Sau 30 phát bắn, Cuồng nộ trong 3 giây. Đạn không giới hạn, hồi 1,0% máu tối đa mỗi đòn, +150% sát thương. Phát tích lực cuối gây 10000%.
block.nevix-berserker.custom-stat.none.berserkerBloodShield = Hút máu hồi máu cho tháp; phần hồi vượt mức trở thành Khiên máu không giới hạn. Khiên hấp thụ mọi sát thương và phá hủy đạn của kẻ địch gần đó.
block.nevix-berserker.custom-stat.none.berserkerRage = Cuồng nộ: bắn liên tục mà không tiêu hao đạn, kéo kẻ địch gần đó lại, và hồi máu mỗi đòn (hồi vượt mức -> Khiên máu). Khi kết thúc, bắn một phát tích lực.

